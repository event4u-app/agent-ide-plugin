name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: node (${{ matrix.os }} · node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run format
      - run: pnpm run typecheck
      - run: pnpm run build
      - run: pnpm run test

  jetbrains:
    name: jetbrains (gradle check)
    runs-on: ubuntu-latest
    # The Kotlin client is an authored skeleton not yet compiled on a JVM
    # (the authoring environment had no JDK). Kept non-blocking until the
    # first green JDK-17 run confirms it; flip `continue-on-error` off then.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate wrapper + run checks
        working-directory: clients/jetbrains
        run: |
          gradle wrapper --gradle-version 8.11.1
          ./gradlew check --no-daemon
