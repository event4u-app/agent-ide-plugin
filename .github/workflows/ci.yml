name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: node (${{ matrix.os }} · node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run format
      - run: pnpm run build
      # typecheck is self-contained: the root script runs `tsc -b` over the
      # composite package graph (emitting the cross-package .d.ts) before the
      # non-composite vscode client's `tsc -p --noEmit`, so it passes from a
      # clean checkout without a prior build.
      - run: pnpm run typecheck
      - run: pnpm run test

  package:
    name: package (installable artifacts)
    runs-on: ubuntu-latest
    # Builds both installable artifacts with the Agent Core sidecar bundled in
    # and asserts the sidecar is present — the autonomous half of Phase 3
    # (T-PRD10 / T-PRD11). "Loads in a clean sandbox" is human/IDE-gated and
    # stays out of CI scope. See docs/adr/ADR-017.
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - run: pnpm install --frozen-lockfile
      # Build the Core sidecar first so both packaging steps can bundle it.
      - run: pnpm run build

      - name: Package VSIX
        working-directory: clients/vscode
        run: pnpm run package

      - name: Assert sidecar is bundled in the VSIX
        working-directory: clients/vscode
        run: unzip -l event4u-agent.vsix | grep -q 'extension/sidecar/server.js'

      - name: Package JetBrains plugin ZIP
        working-directory: clients/jetbrains
        run: |
          gradle wrapper --gradle-version 8.11.1
          ./gradlew buildPlugin --no-daemon

      - name: Assert sidecar is bundled in the JetBrains ZIP
        working-directory: clients/jetbrains
        run: unzip -l build/distributions/*.zip | grep -q 'sidecar/server.js'

  jetbrains:
    name: jetbrains (gradle check)
    runs-on: ubuntu-latest
    # Blocking gate: the Kotlin client compiles and passes detekt + ktlint on
    # JDK 17 (confirmed green on CI 2026-05-29). runIde / IDE-install checks
    # still need a human-driven IDE and are out of CI scope.
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate wrapper + run checks
        working-directory: clients/jetbrains
        run: |
          gradle wrapper --gradle-version 8.11.1
          ./gradlew check --no-daemon
