version: '3'

tasks:
  default:
    cmds:
      - task --list
    silent: true

  install:
    desc: Install all workspace dependencies
    cmds:
      - pnpm install

  setup:
    desc: One-command bootstrap after checkout — deps, build, JetBrains toolchain
    cmds:
      - task: install
      - task: build
      - task: jetbrains:setup

  build:
    desc: Build all TypeScript packages + the VS Code extension
    cmds:
      - pnpm run build

  test:
    desc: Run unit tests across all packages
    cmds:
      - pnpm run test

  lint:
    desc: ESLint over the TypeScript sources
    cmds:
      - pnpm run lint

  typecheck:
    desc: Type-check all packages without emitting
    cmds:
      - pnpm run typecheck

  format:
    desc: Check formatting with Prettier
    cmds:
      - pnpm run format

  codegen:
    desc: Generate Kotlin DTOs from the Zod protocol schemas
    cmds:
      - pnpm exec tsx scripts/codegen.ts

  ci:
    desc: Full local gate — lint, format, build, typecheck, test
    cmds:
      - task: lint
      - task: format
      - task: build
      - task: typecheck
      - task: test

  package:
    desc: Build both installable artifacts (.vsix + JetBrains ZIP) with the sidecar bundled
    cmds:
      - task: vscode:package
      - task: jetbrains:package

  # --- JetBrains client (requires JDK 17 + Gradle wrapper; not runnable without a JVM) ---
  jetbrains:setup:
    desc: One-time local toolchain for the JetBrains client — JDK 17, Gradle, wrapper (macOS/Homebrew)
    dir: clients/jetbrains
    cmds:
      - |
        set -e
        command -v brew >/dev/null 2>&1 || { echo "❌ Homebrew required — see https://brew.sh"; exit 1; }
        brew list openjdk@17 >/dev/null 2>&1 || brew install openjdk@17
        command -v gradle >/dev/null 2>&1 || brew install gradle
        if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
          echo "Bootstrapping Gradle wrapper 8.11.1…"
          JAVA_HOME="$(brew --prefix openjdk@17)/libexec/openjdk.jdk/Contents/Home" \
            gradle wrapper --gradle-version 8.11.1
        fi
        echo "✅ JetBrains client ready — run: task jetbrains:runIde"

  jetbrains:check:
    desc: Run the JetBrains plugin checks (compile + detekt + ktlint; needs JDK 17)
    dir: clients/jetbrains
    cmds:
      - |
        export JAVA_HOME="${JAVA_HOME:-$(brew --prefix openjdk@17 2>/dev/null)/libexec/openjdk.jdk/Contents/Home}"
        ./gradlew check

  jetbrains:runIde:
    desc: Launch a sandbox IDE with the plugin installed (needs JDK 17 + GUI)
    dir: clients/jetbrains
    cmds:
      - |
        export JAVA_HOME="${JAVA_HOME:-$(brew --prefix openjdk@17 2>/dev/null)/libexec/openjdk.jdk/Contents/Home}"
        ./gradlew runIde

  jetbrains:package:
    desc: Build the JetBrains plugin ZIP (build/distributions/) with the sidecar bundled (T-PRD11)
    deps: [build]
    dir: clients/jetbrains
    cmds:
      - |
        export JAVA_HOME="${JAVA_HOME:-$(brew --prefix openjdk@17 2>/dev/null)/libexec/openjdk.jdk/Contents/Home}"
        ./gradlew buildPlugin

  # --- VS Code client ---
  vscode:build:
    desc: Bundle the VS Code extension
    dir: clients/vscode
    cmds:
      - pnpm run build

  vscode:run:
    desc: Open VS Code with the extension loaded (requires the `code` CLI)
    dir: clients/vscode
    cmds:
      - code --extensionDevelopmentPath="$(pwd)"

  vscode:package:
    desc: Build a .vsix (clients/vscode/event4u-agent.vsix) with the Agent Core sidecar bundled (T-PRD10)
    deps: [build]
    dir: clients/vscode
    cmds:
      - pnpm run package
